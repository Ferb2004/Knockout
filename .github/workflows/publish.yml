name: Build and attach plugin to release

on:
  release:
    types: [published]
  workflow_dispatch:   # ręczne uruchomienie do testów (bez dołączania do release'u)

permissions:
  contents: write      # potrzebne do dodania pliku .jar do release'u

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # libraries.minecraft.net nie ma maven-metadata.xml (zakresy wersji nie działają),
      # więc dokładne wersje bibliotek Mojanga bierzemy z manifestu Minecraft 26.3.
      - name: Resolve Mojang library versions
        run: |
          MC=26.3
          URL=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r --arg v "$MC" '.versions[] | select(.id==$v) | .url')
          [ -n "$URL" ] || { echo "Nie znaleziono wersji $MC w manifeście Mojanga"; exit 1; }
          JSON=$(curl -fsSL "$URL")
          AUTHLIB=$(echo "$JSON" | jq -r '[.libraries[].name | select(startswith("com.mojang:authlib:"))][0] | split(":")[2]')
          DFU=$(echo "$JSON" | jq -r '[.libraries[].name | select(startswith("com.mojang:datafixerupper:"))][0] | split(":")[2]')
          echo "authlib=$AUTHLIB datafixerupper=$DFU"
          [ -n "$AUTHLIB" ] && [ "$AUTHLIB" != "null" ] && [ -n "$DFU" ] && [ "$DFU" != "null" ]
          echo "MOJANG_LIBS=-Dauthlib.version=$AUTHLIB -Ddatafixerupper.version=$DFU" >> "$GITHUB_ENV"

      # Jednorazowa inicjalizacja NMS (mapowania Mojanga) dla modułu 26.3.
      # Jeśli wtyczka ma inną nazwę celu w Twojej wersji, popraw tę linię.
      - name: Init Paper NMS
        run: mvn -B $MOJANG_LIBS ca.bkaw:paper-nms-maven-plugin:1.5:init -pl versions/26.3

      - name: Build plugin (Paper 26.3)
        run: >
          mvn -B clean package $MOJANG_LIBS
          -P build-one-version
          -Doutput.version=26.3
          -Dplugin.output.directory=${{ github.workspace }}/out
          -pl build -am

      # Diagnostyka: gdy build padnie, wypisz sygnatury klas NMS, których kod używa
      - name: Dump NMS signatures (on failure)
        if: failure()
        run: |
          JAR=$(ls ~/.m2/repository/ca/bkaw/paper-nms/*/paper-nms-*.jar | head -n1)
          echo "Using $JAR"
          for c in net.minecraft.world.entity.EntitySpawnRequest net.minecraft.world.entity.UpdateInterval net.minecraft.server.level.ServerEntity net.minecraft.world.entity.EntityType net.minecraft.server.level.ServerPlayer; do
            echo "=== $c ==="
            javap -cp "$JAR" -public "$c" | grep -E "class|interface|record|enum|static|ServerEntity\(|ServerPlayer\(|create|of\(|UpdateInterval|EntitySpawnRequest|getServer|server" || true
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knockout-paper-26.3
          path: out/*.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.jar --clobber
