name: Build and attach plugin to release

on:
  release:
    types: [published]
  workflow_dispatch:   # ręczne uruchomienie do testów (bez dołączania do release'u)

permissions:
  contents: write      # potrzebne do dodania pliku .jar do release'u

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Jednorazowa inicjalizacja NMS (mapowania Mojanga) dla modułu 26.3.
      # Jeśli wtyczka ma inną nazwę celu w Twojej wersji, popraw tę linię.
      - name: Init Paper NMS
        run: mvn -B ca.bkaw:paper-nms-maven-plugin:1.5:init -pl versions/26.3

      - name: Build plugin (Paper 26.3)
        run: >
          mvn -B clean package
          -P build-one-version
          -Doutput.version=26.3
          -Dplugin.output.directory=${{ github.workspace }}/out
          -pl build -am

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knockout-paper-26.3
          path: out/*.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.jar --clobber
